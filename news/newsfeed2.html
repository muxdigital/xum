<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Feed</title>
    
    <!-- Custom Purple & Arial Styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f5fa;
            color: #333333;
            margin: 0;
            padding: 20px;
        }

        #divFeed1 {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(106, 27, 154, 0.1);
            border-top: 5px solid #6a1b9a; /* Deep Purple accent */
        }

        /* Feed Ek Plugin Typography and Structure Styling */
        #divFeed1 ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #divFeed1 li {
            border-bottom: 1px solid #e1bee7; /* Soft purple divider */
            padding: 15px 0;
        }

        #divFeed1 li:last-child {
            border-bottom: none;
        }

        /* Target Feed Title Links */
        #divFeed1 .feedTitle a {
            color: #6a1b9a; /* Dark Purple */
            font-weight: bold;
            font-size: 1.15rem;
            text-decoration: none;
        }

        #divFeed1 .feedTitle a:hover {
            color: #8e24aa; /* Vibrant Purple */
            text-decoration: underline;
        }

        /* Target Publication Date */
        #divFeed1 .feedDate {
            color: #7b1fa2; /* Muted Purple */
            font-size: 0.85rem;
            margin-top: 4px;
            display: block;
        }

        /* Target Description Content */
        #divFeed1 .feedItemDescription {
            color: #4a4a4a;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- Container for Feed -->
    <div id="divFeed1"></div>

    <!-- Core Scripts & Feed Logic (Strictly Untouched) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script type="text/javascript" src="https://jquery-plugins.net/FeedEk/FeedEk.min.js"></script>

    <script type="text/javascript">
        $('#divFeed1').FeedEk({
        FeedUrl : ['https://news.google.com/rss/search?q=site%3Areuters.com&hl=en-US&gl=US&ceid=US%3Aen','https://news.google.com/rss/search?q=site%3Aapnews.com&hl=en-US&gl=US&ceid=US%3Aen'],
        MaxCount : 5,
        ShowDesc : true,
        ShowPubDate:true,
        DescCharacterLimit:100,
        TitleLinkTarget:'_blank',
        DateFormat : 'MM/dd/yyyy',
        DateFormatLang : 'en',
        Offset: 1,
    });
    </script>

</body>
</html>
