<!-- Player Element -->
<div class="video-container">
<video id="player" controls playsinline></video>

<!-- Hls.js and Plyr JS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const video = document.getElementById('player');
        const source = video.querySelector('source') ? video.querySelector('source').src : '';
        const defaultSource = 'https://live20.bozztv.com/akamaissh101/ssh101/muxtvnet/playlist.m3u8';
        
        // Initialize Plyr
        const player = new Plyr(video, {
            captions: { active: true, update: true, language: 'en' },
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'pip', 'fullscreen'],
            settings: ['quality', 'speed'],
            autoplay: false,
            pip: true,
            quality: {
                default: 360,
                options: [1080, 720, 576, 480, 360, 240, 144],
                forced: true,
                onChange: (e) => console.log(e)
           }
        });

        // Initialize Hls.js
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(defaultSource);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
            });

            // Channel Switching Logic
            document.querySelectorAll('.channel-item').forEach(item => {
                item.addEventListener('click', () => {
                    const newSrc = item.getAttribute('data-src');
                    hls.loadSource(newSrc);
                    hls.attachMedia(video);
                });
            });
        } else {
            // Fallback for native HLS (Safari)
            video.src = defaultSource;
        }
    });
</script>
