<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Radio Player</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .player-card {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    select, button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
    }
    audio {
      width: 100%;
      margin-top: 20px;
    }
    #status {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>

<div class="player-card">
  <h2>Web Radio</h2>
  
  <select id="stationSelect" disabled>
    <option>Loading stations...</option>
  </select>

  <audio id="audioPlayer" controls autoplay></audio>
  <div id="status">Fetching M3U playlist...</div>
</div>

<script>
  // Replace with your M3U playlist URL
  const m3uUrl = 'https://example.com/playlist.m3u';
  
  // Use a CORS proxy if the external server blocks browser requests
  const useCorsProxy = false; 
  const fetchUrl = useCorsProxy ? `https://api.allorigins.win/raw?url=${encodeURIComponent(m3uUrl)}` : m3uUrl;

  const selectEl = document.getElementById('stationSelect');
  const audioEl = document.getElementById('audioPlayer');
  const statusEl = document.getElementById('status');

  async function loadPlaylist() {
    try {
      const response = await fetch(fetchUrl);
      if (!response.ok) throw new Error('Failed to load playlist');
      const text = await response.text();
      
      const stations = parseM3U(text);
      populateSelect(stations);
    } catch (err) {
      statusEl.textContent = 'Error loading M3U file. (Check CORS settings)';
      console.error(err);
    }
  }

  function parseM3U(content) {
    const lines = content.split(/\r?\n/);
    const stations = [];
    let currentTitle = '';

    for (let line of lines) {
      line = line.trim();
      if (line.startsWith('#EXTINF:')) {
        // Extract title after the comma
        const commaIdx = line.indexOf(',');
        currentTitle = commaIdx !== -1 ? line.substring(commaIdx + 1) : 'Unknown Station';
      } else if (line && !line.startsWith('#')) {
        // Line is a URL
        stations.push({
          title: currentTitle || line,
          url: line
        });
        currentTitle = '';
      }
    }
    return stations;
  }

  function populateSelect(stations) {
    if (stations.length === 0) {
      statusEl.textContent = 'No stations found in playlist.';
      return;
    }

    selectEl.innerHTML = '<option value="">-- Select a Station --</option>';
    stations.forEach(station => {
      const option = document.createElement('option');
      option.value = station.url;
      option.textContent = station.title;
      selectEl.appendChild(option);
    });

    selectEl.disabled = false;
    statusEl.textContent = `Loaded ${stations.length} stations.`;
  }

  selectEl.addEventListener('change', (e) => {
    const streamUrl = e.target.value;
    if (streamUrl) {
      audioEl.src = streamUrl;
      audioEl.play().catch(err => console.log('Autoplay blocked or stream error:', err));
    } else {
      audioEl.pause();
      audioEl.src = '';
    }
  });

  loadPlaylist();
</script>

</body>
</html>
