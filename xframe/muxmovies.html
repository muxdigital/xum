<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="appUrl" content="https://eu1.servers10.com/VideoPlayer/8106" />
<link href="https://cdn.jsdelivr.net/npm/video.js@7/dist/video-js.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/silvermine-videojs-quality-selector@1.1.2/dist/css/quality-selector.min.css" rel="stylesheet">
<link href="https://muxdigital.github.io/xum/xframe/videojs-iframe.css" rel="stylesheet">
<link rel="icon" href="favicon.ico">
<title>MUX PLAYER</title>
</head>
<body>
<div class="player-container">
<div class="OfflineImage" >
OFFLINE.
<span>Retry 00:<span id="restart-counter">30</span></span>
</div>
<i class="custom-volume-button" style="display: none"></i>
<video id="videojs" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="none" fluid="true" >
<source src="https://live20.bozztv.com/giatvplayout7/giatv-209412/playlist.m3u8" type="application/x-mpegURL">
<p class="vjs-no-js">
To view this video please enable JavaScript, and consider upgrading to a web browser that
<a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
</p>
</video>
</div>
<script src="https://cdn.jsdelivr.net/npm/video.js@7/dist/video.min.js"></script>
<script type="text/javascript">
        var player;
        (function() {
            player = videojs('videojs', {
                //inactivityTimeout: 0,
                errorDisplay: false,
                controlBar: {
                    children: [
                        'PlayToggle',
                        'ProgressControl',
                        'LiveDisplay',
                        'RemainingTimeDisplay',
                        'CustomControlSpacer',
                        'PictureInPictureToggle',
                        'FullscreenToggle',
                    ],
                    volumePanel: {
                        inline: false
                    },
                },
            });
            //player.controlBar.addChild('QualitySelector');
            
            

            
            console.log('autoplay');

            player.ready(function () {
                var promise = player.play();

                if (promise !== undefined) {
                    promise.then(function () {
                        // Autoplay started!
                        console.log('autoplay started')
                    }).catch(function (error) {
                        // Autoplay was prevented.
                        console.log('autoplay prevented')
                        player.muted(true);
                        player.play();
                        document.querySelector('.custom-volume-button').style.display = 'block';
                    });
                }

            });

            player.on('useractive', (event) => {
                document.querySelector('.custom-volume-button').style.display = 'none';
            });
            player.on('userinactive', (event) => {
                document.querySelector('.custom-volume-button').style.display = this.player.volume() == 0 || document.querySelector('video').getAttribute('muted') === 'muted' ? 'block' : 'none';
            });
            player.on('volumechange', (event) => {
                document.querySelector('.custom-volume-button').style.display = this.player.volume() == 0 || document.querySelector('video').getAttribute('muted') === 'muted' ? 'block' : 'none';
            });
                        })();
    </script>
<script src="https://muxdigital.github.io/xum/xframe/videojs-iframe-support.js"></script>
</body>
</html>
